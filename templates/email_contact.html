<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Сообщение с сайта</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
        }
        .header {
            background-color: #2563eb;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .content {
            padding: 20px;
            background-color: #f9fafb;
        }
        .footer {
            text-align: center;
            padding: 10px;
            font-size: 12px;
            color: #6b7280;
        }
        .info-item {
            margin-bottom: 10px;
        }
        .label {
            font-weight: bold;
        }
        .message {
            background-color: #ffffff;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #e5e7eb;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Сообщение с сайта</h1>
    </div>
    <div class="content">
        <div class="info-item">
            <span class="label">Имя:</span> {{.Name}}
        </div>
        <div class="info-item">
            <span class="label">Телефон:</span> {{.Phone}}
        </div>
        {{if .Email}}
        <div class="info-item">
            <span class="label">Email:</span> {{.Email}}
        </div>
        {{end}}
        {{if .Message}}
        <div class="info-item">
            <span class="label">Сообщение:</span>
            <div class="message">{{.Message}}</div>
        </div>
        {{end}}
    </div>
    <div class="footer">
        <p>Сообщение отправлено с сайта БалконМастер</p>
    </div>
</body>
</html>
